<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Border -->
  <path d="M 256 32 C 340 32 440 64 440 64 C 440 240 400 380 256 480 C 112 380 72 240 72 64 C 72 64 172 32 256 32 Z" 
        fill="url(#goldShield)" 
        filter="url(#glow)" />

  <!-- Inner Dark Shield -->
  <path d="M 256 56 C 328 56 416 84 416 84 C 416 232 380 356 256 448 C 132 356 96 232 96 84 C 96 84 184 56 256 56 Z" 
        fill="url(#shieldBg)" 
        stroke="#ca8a04" 
        stroke-width="4" />

  <!-- Inner Gold Trim Ring -->
  <path d="M 256 76 C 316 76 392 100 392 100 C 392 224 360 332 256 418 C 152 332 120 224 120 100 C 120 100 196 76 256 76 Z" 
        fill="none" 
        stroke="url(#goldShield)" 
        stroke-width="3" 
        opacity="0.6" />

  <!-- Terminal Prompt >_ -->
  <!-- Greater Than Symbol > -->
  <path d="M 180 180 L 250 236 L 180 292" 
        fill="none" 
        stroke="url(#goldShield)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Underscore Symbol _ -->
  <line x1="275" y1="292" x2="335" y2="292" 
        stroke="url(#goldShield)" 
        stroke-width="28" 
        stroke-linecap="round" />
</svg>
