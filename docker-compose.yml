services:
  wiki:
    image: nginx:alpine
    container_name: knowops-wiki
    restart: unless-stopped
    ports:
      - "${WIKI_PORT:-8085}:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./public:/usr/share/nginx/html/public:ro
      - ./docs:/usr/share/nginx/html/docs:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - knowops-internal

  api:
    build: .
    image: knowopswiki-api:latest
    container_name: knowops-api
    restart: unless-stopped
    # Port 9000 NIE jest mapowany na hosta - dostep tylko przez wewnetrzna siec Docker
    # Nginx komunikuje sie z API przez knowops-internal (knowops-api:9000)
    expose:
      - "9000"
    volumes:
      - ./docs:/app/docs:rw
      - ./data:/app/data:rw
      - ./public:/app/public:rw
      - ./backups:/app/backups:rw
      - ./scripts:/app/scripts:ro
      - ./server.mjs:/app/server.mjs:ro
      - ./backup_wiki.mjs:/app/backup_wiki.mjs:ro
      - ./cve_engine.mjs:/app/cve_engine.mjs:ro
      - ./entrypoint.sh:/app/entrypoint.sh:ro
    env_file:
      - .env
    environment:
      - API_PORT=9000
      - TZ=${TZ:-Europe/Warsaw}
      - BACKUP_SCHEDULE_TIME=${BACKUP_SCHEDULE_TIME:-22:00}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"import('http').then(h => h.get('http://localhost:9000/api/check-auth', res => process.exit(res.statusCode === 200 ? 0 : 1)))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - knowops-internal

networks:
  knowops-internal:
    driver: bridge
